# This workflow uploads Python distributions to PyPI using Trusted Publishing.
# Configure the matching PyPI trusted publisher before creating the next release.

name: Upload Python Package

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: |
        python -m build
    - name: Check distribution contents
      run: |
        python scripts/check_dist_safety.py dist/*
    - name: Store distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-distributions
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/coolbox
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-distributions
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
